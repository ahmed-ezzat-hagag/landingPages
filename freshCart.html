<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshCart | Freshness Delivered</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-stone-50 font-sans text-slate-900">

    <div class="bg-orange-500 text-white text-center py-2 text-sm font-medium">
        🚀 Next delivery slot available at <span class="underline">4:30 PM Today</span>
    </div>

    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-2">
                    <div class="bg-green-600 p-2 rounded-xl">
                        <i class="fas fa-leaf text-white"></i>
                    </div>
                    <span class="text-2xl font-black tracking-tighter text-slate-800 uppercase">Fresh<span class="text-green-600">Cart</span></span>
                </div>

                <div class="hidden md:flex flex-1 max-w-lg mx-12">
                    <div class="relative w-full">
                        <input type="text" placeholder="Search fresh produce, snacks, or meat..." class="w-full pl-12 pr-4 py-3 rounded-2xl border-none bg-stone-100 focus:ring-2 focus:ring-green-500 transition-all">
                        <i class="fas fa-search absolute left-4 top-4 text-slate-400"></i>
                    </div>
                </div>

                <div class="flex items-center gap-6">
                    <button class="relative text-slate-700 hover:text-green-600 transition-colors">
                        <i class="fas fa-shopping-basket text-2xl"></i>
                        <span class="absolute -top-2 -right-2 bg-orange-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">3</span>
                    </button>
                    <button class="hidden sm:block font-bold text-slate-800 border-2 border-slate-800 px-5 py-2 rounded-xl hover:bg-slate-800 hover:text-white transition-all">
                        Sign In
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
        <div class="relative rounded-[2rem] overflow-hidden bg-emerald-900 h-[500px] flex items-center">
            <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&q=80&w=1200" alt="Fresh Vegetables" class="absolute inset-0 w-full h-full object-cover opacity-60">
            <div class="relative z-10 p-8 md:p-16 max-w-2xl">
                <span class="bg-orange-500 text-white px-4 py-1 rounded-full text-sm font-bold mb-6 inline-block uppercase tracking-widest">Organic & Fresh</span>
                <h1 class="text-5xl md:text-7xl font-black text-white mb-6 leading-[1.1]">
                    Grocery day <br><span class="text-green-400">just got easier.</span>
                </h1>
                <p class="text-xl text-stone-100 mb-8 font-medium">
                    Farm-to-table quality delivered to your kitchen in 45 minutes or less.
                </p>
                <button class="bg-green-500 hover:bg-green-400 text-slate-900 px-10 py-5 rounded-2xl font-black text-lg transition-transform hover:scale-105 shadow-xl">
                    Start Shopping
                </button>
            </div>
        </div>
    </header>

    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="flex justify-between items-end mb-8">
            <h2 class="text-3xl font-black text-slate-800">Browse Categories</h2>
            <a href="#" class="text-green-600 font-bold hover:underline">View All <i class="fas fa-chevron-right ml-1"></i></a>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <div class="bg-white p-6 rounded-3xl text-center group cursor-pointer hover:shadow-xl hover:shadow-green-900/5 transition-all border border-stone-100">
                <div class="w-16 h-16 bg-orange-100 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                    <i class="fas fa-carrot text-2xl text-orange-600"></i>
                </div>
                <span class="font-bold text-slate-700">Vegetables</span>
            </div>
            <div class="bg-white p-6 rounded-3xl text-center group cursor-pointer hover:shadow-xl hover:shadow-green-900/5 transition-all border border-stone-100">
                <div class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                    <i class="fas fa-cow text-2xl text-blue-600"></i>
                </div>
                <span class="font-bold text-slate-700">Dairy & Eggs</span>
            </div>
            <div class="bg-white p-6 rounded-3xl text-center group cursor-pointer hover:shadow-xl hover:shadow-green-900/5 transition-all border border-stone-100">
                <div class="w-16 h-16 bg-red-100 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                    <i class="fas fa-drumstick-bite text-2xl text-red-600"></i>
                </div>
                <span class="font-bold text-slate-700">Meat & Fish</span>
            </div>
            <div class="bg-white p-6 rounded-3xl text-center group cursor-pointer hover:shadow-xl hover:shadow-green-900/5 transition-all border border-stone-100">
                <div class="w-16 h-16 bg-yellow-100 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                    <i class="fas fa-bread-slice text-2xl text-yellow-600"></i>
                </div>
                <span class="font-bold text-slate-700">Bakery</span>
            </div>
            <div class="bg-white p-6 rounded-3xl text-center group cursor-pointer hover:shadow-xl hover:shadow-green-900/5 transition-all border border-stone-100">
                <div class="w-16 h-16 bg-purple-100 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                    <i class="fas fa-wine-glass text-2xl text-purple-600"></i>
                </div>
                <span class="font-bold text-slate-700">Beverages</span>
            </div>
            <div class="bg-white p-6 rounded-3xl text-center group cursor-pointer hover:shadow-xl hover:shadow-green-900/5 transition-all border border-stone-100">
                <div class="w-16 h-16 bg-teal-100 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                    <i class="fas fa-soap text-2xl text-teal-600"></i>
                </div>
                <span class="font-bold text-slate-700">Household</span>
            </div>
        </div>
    </section>

</body>
</html>
